# Publishes wireproxy (https://github.com/windtf/wireproxy, ISC licence), the
# userspace WireGuard client behind Apex's "bring your own VPN" feature.
# wireproxy releases aren't signed, so this is pinned: to upgrade, review the
# new release, then update VERSION and SHA256 (of the windows_amd64 tar.gz)
# and run this workflow from the Actions tab.
name: Publish wireproxy

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: v1.1.3
  SHA256: bce041ea9fe0f8a3351301dcbe29cdf6a523bb25cf9c62f17ebb5699a8051d0f

jobs:
  wireproxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download and check the pinned release
        run: |
          curl -fsSLO "https://github.com/windtf/wireproxy/releases/download/$VERSION/wireproxy_windows_amd64.tar.gz"
          echo "$SHA256  wireproxy_windows_amd64.tar.gz" | sha256sum -c -
          tar -xzf wireproxy_windows_amd64.tar.gz wireproxy.exe

      - name: Publish release and signed wireproxy.json
        env:
          GH_TOKEN: ${{ github.token }}
          APEX_SIGNING_KEY: ${{ secrets.APEX_SIGNING_KEY }}
        run: |
          gh release create "wireproxy-$VERSION" wireproxy.exe --title "wireproxy $VERSION" \
            --notes "wireproxy.exe $VERSION (Windows x86_64) from github.com/windtf/wireproxy, checked against a pinned SHA-256."
          EXE_SHA=$(sha256sum wireproxy.exe | cut -d' ' -f1)
          URL="https://github.com/${{ github.repository }}/releases/download/wireproxy-$VERSION/wireproxy.exe"
          printf '{"version":"%s","url":"%s","sha256":"%s"}\n' "$VERSION" "$URL" "$EXE_SHA" > wireproxy.json
          node sign.mjs wireproxy wireproxy.json "$(date +%s)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wireproxy.json wireproxy.json.sig
          git commit -m "wireproxy $VERSION"
          git push
